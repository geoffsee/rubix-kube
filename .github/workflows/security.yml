name: Security

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  merge_group:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Metadata edits must not cancel active or queued validation of the same revision.
  group: >-
    ${{ github.workflow }}-${{ github.ref }}-${{
      github.event_name == 'pull_request' && github.event.action == 'edited'
      && !github.event.changes.base && (github.event.changes.title || github.event.changes.body)
      && 'metadata' || 'validation' }}
  cancel-in-progress: true

jobs:
  security:
    # Skipped required checks count as passing. Use a separate name for metadata-only events.
    name: >-
      ${{ github.event_name == 'pull_request' && github.event.action == 'edited'
        && !github.event.changes.base && (github.event.changes.title || github.event.changes.body)
        && 'Metadata edit (Security)' || 'Security' }}
    if: >-
      github.event_name != 'pull_request' || github.event.action != 'edited'
      || github.event.changes.base || !(github.event.changes.title || github.event.changes.body)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.5'
          python-version: '3.12'
          enable-cache: true
          prune-cache: false
          cache-dependency-glob: .github/security/uv.lock
          save-cache: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      - name: Install locked CLI tools
        run: uv sync --project .github/security --locked
      - name: Run local security checks
        run: uv run --project .github/security --frozen --offline --no-sync python .github/security/check.py
