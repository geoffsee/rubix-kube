name: Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., v1.0.0)"
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  publish:
    name: Trusted publication gate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-rust
        with:
          cache-key: publish
      - name: Build dist candidates
        run: cargo build --locked --profile dist -p rubix-kube -p rubixctl
      - name: Generate release candidate signing manifests and distribution metadata
        run: |
          mkdir -p dist
          cp target/dist/rubix-kube dist/
          cp target/dist/rubixctl dist/
          cargo run --locked -p rubix-dev --bin rubix-provenance -- dist "${{ github.event.inputs.version }}"
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          files: |
            dist/*
