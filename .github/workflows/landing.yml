name: Landing

on:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test-release:
    name: Tests (release)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-rust
        with:
          cache-key: test-release
      - name: Test all targets and doctests
        run: |
          cargo test --locked --workspace --all-targets --all-features --release
          cargo test --locked --workspace --doc --all-features --release

  dist:
    name: Dist build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-rust
        with:
          cache-key: dist
      - name: Build ship binaries
        run: cargo build --locked --profile dist -p rubix-kube -p rubixctl
      - name: Upload ship binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-binaries-${{ github.run_id }}
          path: |
            target/dist/rubix-kube
            target/dist/rubixctl
          if-no-files-found: error
          retention-days: 14

  upstream:
    name: Upstream inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-rust
        with:
          cache-key: upstream
      - name: Restore prepared upstream inputs
        id: upstream-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/upstream
          key: upstream-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/upstream/inputs.json') }}
      - name: Verify generated clients and independent source inventories
        run: |
          cargo run --locked -p rubix-dev --bin rubix-upstream -- fetch
          cargo fetch --locked
          cargo build -p rubix-upstream-codegen --locked
          cargo run --locked -p rubix-dev --bin rubix-upstream -- verify
          cargo run --locked -p rubix-dev --bin rubix-upstream -- check-cri
          cargo run --locked -p rubix-dev --bin rubix-upstream -- check-containerd
          cargo run --locked -p rubix-dev --bin rubix-upstream -- check-kubernetes-bindings
          cargo run --locked -p rubix-dev --bin rubix-drift -- check
      - name: Test prepared protocol parser with verified compiler
        env:
          RUBIX_UPSTREAM_CACHE: ${{ github.workspace }}/target/upstream
        run: cargo test --locked -p rubix-dev --test upstream_internals -- --ignored --exact drift::tests::actual_verified_protoc_detects_field_number_type_rpc_and_streaming_mutations
      - name: Save verified upstream inputs
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.upstream-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/upstream
          key: ${{ steps.upstream-cache.outputs.cache-primary-key }}
