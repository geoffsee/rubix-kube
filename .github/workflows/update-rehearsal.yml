name: Update rehearsal

on:
  schedule:
    - cron: '47 7 * * 1'
  workflow_dispatch:
    inputs:
      version:
        description: "Target Kubernetes version for update rehearsal"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rehearsal:
    name: Upstream update rehearsal
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-rust
        with:
          cache-key: update-rehearsal
      - name: Rehearse upstream inputs update
        run: |
          cargo run --locked -p rubix-dev --bin rubix-upstream -- fetch
          cargo run --locked -p rubix-dev --bin rubix-upstream -- verify
          # Extract current drift baseline
          cargo run --locked -p rubix-dev --bin rubix-drift -- extract --cache-dir target/upstream --inventory target/rehearsal.json.gz
      - name: Generate update report
        run: |
          cargo run --locked -p rubix-dev --bin rubix-drift -- report \
            --before tools/drift/inventory.json.gz \
            --after target/rehearsal.json.gz \
            --format markdown > update-report.md
      - name: Publish update report
        run: cat update-report.md >> $GITHUB_STEP_SUMMARY
      - name: Run independent parity checks
        run: |
          cargo run --locked -p rubix-dev --bin rubix-parity -- check
          cargo test --locked -p rubix-upstream-codegen --test api_json
