name: CI

on:
  push:
    branches: [main]
  pull_request:
    # Revalidate after a base change; stable required check names also survive metadata edits.
    types: [opened, synchronize, reopened, edited]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: Format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-rust
      - run: cargo fmt-check

  lint:
    name: Clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-rust
        with:
          cache-key: clippy
      - run: cargo lint

  test:
    name: Tests (${{ matrix.profile }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profile: [debug, release]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-rust
        with:
          cache-key: test-${{ matrix.profile }}
      - name: Test all targets and doctests
        env:
          TEST_PROFILE: ${{ matrix.profile }}
        run: |
          profile_args=()
          if [[ "$TEST_PROFILE" == release ]]; then
            profile_args+=(--release)
          fi
          cargo test --locked --workspace --all-targets --all-features "${profile_args[@]}"
          python3 - <<'PY'
          import json
          import os
          import subprocess
          metadata = json.loads(subprocess.check_output(
              ["cargo", "metadata", "--locked", "--no-deps", "--format-version", "1"]))
          members = set(metadata["workspace_members"])
          has_doctests = any(target["doctest"]
                             for package in metadata["packages"] if package["id"] in members
                             for target in package["targets"])
          if has_doctests:
              command = ["cargo", "test", "--locked", "--workspace", "--doc", "--all-features"]
              if os.environ["TEST_PROFILE"] == "release":
                  command.append("--release")
              subprocess.run(command, check=True)
          else:
              print("No workspace targets enable doctests.")
          PY

      - name: Test repository Python tooling
        if: matrix.profile == 'debug'
        run: python3 .github/test-python.py

  dependencies:
    name: Dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the pinned toolchain
        id: toolchain
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib
          with open("rust-toolchain.toml", "rb") as source:
              print("version=" + tomllib.load(source)["toolchain"]["channel"])
          PY
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          rust-version: ${{ steps.toolchain.outputs.version }}
          arguments: --locked --all-features
          command: check
