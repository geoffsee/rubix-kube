name: CI

on:
  push:
    branches: [main]
  pull_request:
    # Revalidate after a base change; stable required check names also survive metadata edits.
    types: [opened, synchronize, reopened, edited]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: Format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-rust
      - run: cargo fmt-check

  lint:
    name: Clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-rust
        with:
          cache-key: clippy
      - name: Enforce repository language policy
        run: cargo run --locked -p rubix-dev --bin rubix-language-policy
      - run: cargo lint

  test:
    name: Tests (debug)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-rust
        with:
          cache-key: test-debug
      - name: Test all targets and doctests
        run: |
          cargo test --locked --workspace --all-targets --all-features
          cargo test --locked --workspace --doc --all-features

  dependencies:
    name: Dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the pinned toolchain
        id: toolchain
        run: |
          rustup toolchain install --no-self-update
          version=$(rustc --version | cut -d ' ' -f 2)
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          rust-version: ${{ steps.toolchain.outputs.version }}
          arguments: --locked --all-features
          command: check
