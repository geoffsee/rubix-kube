[package]
name = "rubix-upstream-codegen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
autotests = false

[dependencies]
prost-build = "=0.14.4"
prost-types = "=0.14.4"
tonic-build = "=0.14.6"
tonic-prost-build = "=0.14.6"

[dev-dependencies]
serde = "=1.0.228"
serde_json = "=1.0.151"
k8s-openapi = { version = "=0.28.0", default-features = false, features = ["v1_35"] }

[lints]
workspace = true

[[test]]
name = "suite"
path = "tests/suite.rs"
