[package]
name = "rubix-dev"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
autotests = false

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
base64 = "=0.22.1"
syn = { version = "=2.0.119", features = ["full", "visit"] }
sha2 = { version = "=0.11.0", default-features = false }
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
zstd = { version = "=0.13.3", default-features = false }
tempfile = "=3.27.0"
regex = "=1.13.1"
tar = { version = "=0.4.46", default-features = false }
toml = { version = "=0.9.6", default-features = false, features = ["std", "serde", "parse"] }
rustix = { version = "=1.1.5", features = ["fs", "process", "thread"] }
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2"] }
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "signal", "time", "macros", "net", "io-util", "sync"] }
rubix-assets = { version = "=0.1.0", path = "../../crates/rubix-assets" }
rubix-platform = { version = "=0.1.0", path = "../../crates/rubix-platform" }
rubix-apiserver = { version = "=0.1.0", path = "../../crates/rubix-apiserver" }
rubix-config = { version = "=0.1.0", path = "../../crates/rubix-config" }
rubix-controller = { version = "=0.1.0", path = "../../crates/rubix-controller" }
rubix-datastore = { version = "=0.1.0", path = "../../crates/rubix-datastore" }
rubix-dns = { version = "=0.1.0", path = "../../crates/rubix-dns" }
rubix-network = { version = "=0.1.0", path = "../../crates/rubix-network" }
rubix-pki = { version = "=0.1.0", path = "../../crates/rubix-pki" }
rubix-storage = { version = "=0.1.0", path = "../../crates/rubix-storage" }
rubix-supervisor = { version = "=0.1.0", path = "../../crates/rubix-supervisor" }
rubix-kube = { version = "=0.1.0", path = "../../crates/rubix-kube" }
rubixctl = { version = "=0.1.0", path = "../../crates/rubixctl" }
x509-parser = "0.18.1"
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem", "x509-parser"] }

[lints]
workspace = true

[[test]]
name = "suite"
path = "tests/suite.rs"

[[test]]
name = "component_internals"
path = "tests/component_internals.rs"

[[test]]
name = "constrained_namespace"
path = "tests/constrained_namespace.rs"

[[test]]
name = "parity_process"
path = "tests/parity_process.rs"

[[test]]
name = "upstream_internals"
path = "tests/upstream_internals.rs"
