[package]
name = "rubix-kube"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
rubix-config = { version = "=0.1.0", path = "../rubix-config" }
rubix-network = { version = "=0.1.0", path = "../rubix-network" }
serde_json = "=1.0.151"
rubix-platform = { version = "=0.1.0", path = "../rubix-platform" }
rubix-supervisor = { version = "=0.1.0", path = "../rubix-supervisor" }
tokio = { version = "=1.53.1", features = ["rt", "sync", "time", "macros", "signal"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "=1.1.5", features = ["fs", "mount"] }

[dev-dependencies]
tokio = { version = "=1.53.1", features = ["test-util"] }
