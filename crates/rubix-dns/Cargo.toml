[package]
name = "rubix-dns"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
async-trait = "=0.1.89"
k8s-openapi = { version = "=0.28.0", default-features = false, features = ["v1_35"] }
rubix-config = { version = "=0.1.0", path = "../rubix-config" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.18"
tracing = "=0.1.44"

[dev-dependencies]
tempfile = "3.8"
tokio = { version = "=1.53.1", features = ["test-util", "rt-multi-thread"] }

[lints]
workspace = true
