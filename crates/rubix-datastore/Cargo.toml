[package]
name = "rubix-datastore"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
rubix-supervisor = { version = "=0.1.0", path = "../rubix-supervisor" }
rustix = { version = "=1.1.5", features = ["fs"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = { version = "=0.11.0", default-features = false }
tokio = { version = "=1.53.1", features = ["rt", "macros", "sync", "time", "fs"] }

[dev-dependencies]
tempfile = "3.8"
tokio = { version = "=1.53.1", features = ["test-util", "rt-multi-thread"] }
