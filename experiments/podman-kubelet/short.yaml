apiVersion: v1
kind: Pod
metadata:
  name: hello-short
  namespace: default
spec:
  restartPolicy: Never
  containers:
  - name: hello
    image: localhost/rubix-hello:latest
    imagePullPolicy: Never
    command: ["/rubix-hello", "3"]
---
apiVersion: v1
kind: Pod
metadata:
  name: hello-fail
  namespace: default
spec:
  restartPolicy: Never
  containers:
  - name: hello
    image: localhost/rubix-hello:latest
    imagePullPolicy: Never
    command: ["/rubix-hello", "fail"]
